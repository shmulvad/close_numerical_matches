name: Prek auto-update

on:
  # Every Monday at 7 AM UTC (8-9 AM in Copenhagen, depending on daylight saving).
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: j178/prek-action@af4d4fcb6922b8e6f65c0426947125fcc38794ce # v3.0.2
        with:
          install-only: true
      - name: Run prek autoupdate and save output
        run: |
          echo "\`\`\`" > commit_body.md
          prek autoupdate 2>&1 | tee -a commit_body.md
          echo "\`\`\`" >> commit_body.md
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/prek-autoupdate
          title: "prek: bump pre-commit hooks"
          commit-message: "Chore: bump pre-commit hooks"
          body-path: commit_body.md
          base: main
          labels: dependencies
          add-paths: .pre-commit-config.yaml
