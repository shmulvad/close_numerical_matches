[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "close-numerical-matches"
description = "Finds close numerical matches across two arrays, fast."
readme = "README.md"
authors = [{ name = "Soeren Mulvad", email = "shmulvad@gmail.com" }]
license = { file = "LICENSE" }
keywords = ["numpy", "nearest neighbors", "fixed-radius search", "kd-tree", "matching"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]
requires-python = ">=3.11"
dynamic = ["version"]

[project.urls]
Documentation = "https://github.com/shmulvad/close_numerical_matches/"
Changelog = "https://github.com/shmulvad/close_numerical_matches/blob/main/CHANGELOG.md"
Homepage = "https://github.com/shmulvad/close_numerical_matches/"
Github = "https://github.com/shmulvad/close_numerical_matches"
Source = "https://github.com/shmulvad/close_numerical_matches"
Issues = "https://github.com/shmulvad/close_numerical_matches/issues"

[tool.maturin]
module-name = "close_numerical_matches._core"
include = [{ path = "close_numerical_matches/py.typed", format = ["sdist", "wheel"] }]
exclude = ["tests/**", "benchmarks/**"]

[dependency-groups]
dev = [
    "hypothesis>=6.140.0",
    "maturin>=1.15.0",
    "prek>=0.5.5",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
bench = ["scipy>=1.16.0"]

[tool.uv]
# Rebuild the extension when the Rust code changes.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]

[tool.pytest]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]

[tool.pyright]
include = ["close_numerical_matches", "tests", "benchmarks"]
exclude = ["**/__pycache__", ".venv"]
# numpy's own stubs need 3.12 (`collections.abc.Buffer`); ruff enforces 3.11 syntax.
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["close_numerical_matches"]
reportUnnecessaryTypeIgnoreComment = "error"
# `close_numerical_matches._core` is the compiled extension; its types come from
# `_core.pyi`, so type checking does not need it to be built.
reportMissingModuleSource = "none"

[tool.ruff]
fix = false
lint.ignore = ["S101", "B904", "COM812", "E203"]
# See https://docs.astral.sh/ruff/rules/ for more information
lint.select = [
    "C9",
    "E",
    "F",
    "W",
    "B",
    "I",
    "N",
    "UP",
    "A",
    "S",
    "COM",
    "C4",
    "ICN",
    "PIE",
    "Q",
    "PTH",
    "NPY",
    "RUF",
]
line-length = 88
target-version = "py311"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.per-file-ignores]
# Seeded randomness and subprocesses are fine in tests and benchmarks.
"tests/**" = ["S311", "S603"]
"benchmarks/**" = ["S311", "S603", "S607"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"
multiline-quotes = "double"

[tool.ruff.lint.isort]
force-single-line = true
required-imports = ["from __future__ import annotations"]
