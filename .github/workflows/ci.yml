name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

# One run per ref at a time; a new push to a branch cancels its stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  prek:
    name: prek
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        env:
          # These run in the Lint and Rust jobs, with the locked tool versions.
          SKIP: ruff-check,ruff-format,pyright,cargo-fmt

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Set up Python
        run: uv python install
      # Only the tools from uv.lock: type checking uses the `.pyi` stubs, so the
      # extension does not need to be built. The bench group gives pyright scipy.
      - run: uv sync --locked --no-install-project --group bench
      - name: Lint
        run: uv run --no-sync ruff check --output-format=github .
      - name: Format
        run: uv run --no-sync ruff format --check .
      - name: Type-check
        run: uv run --no-sync pyright

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Point PyO3 at a Python interpreter
        run: |
          uv python install
          python="$(uv python find)"
          echo "PYO3_PYTHON=$python" >> "$GITHUB_ENV"
          # `cargo test` links against libpython, which lives in LIBDIR.
          echo "LD_LIBRARY_PATH=$("$python" -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')" >> "$GITHUB_ENV"
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  test:
    name: Test on ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.python-version }}
      # Builds the extension (via maturin) into the project environment.
      - run: uv sync --locked
      - run: uv run --no-sync pytest

  package:
    name: Test built wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build sdist and wheel
        run: uv build
      - name: Run the tests against the installed wheel, not the source tree
        run: |
          uv venv /tmp/wheel-env
          uv pip install --python /tmp/wheel-env dist/*.whl pytest hypothesis
          rm -rf close_numerical_matches
          /tmp/wheel-env/bin/python -m pytest
